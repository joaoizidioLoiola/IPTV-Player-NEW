<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <style>
      .frame { fill: #0066FF; }
      .play { fill: #FFFFFF; stroke: #FFFFFF; stroke-width: 56; stroke-linejoin: round; }
    </style>
  </defs>
  <!-- Frame Play primary mark.
       Frame occupies 75% of the canvas (768×768 px) to stay inside Windows rounded masks.
       Play glyph is enlarged to ~57% of the frame height and shifted +22 px to the right
       so the triangle centroid lands on the optical centre. -->
  <rect class="frame" x="128" y="128" width="768" height="768" rx="160" ry="160"/>
  <path class="play" d="M414 320 L714 512 L414 704 Z"/>
</svg>
